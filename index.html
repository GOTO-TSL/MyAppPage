<!DOCTYPE html>
<html lang="ja">

<head>

<body>
    <header class="site-header">
        <div class="wrap site-header__inner">
            <a href="./" class="brand">Kosuke Goto</a>
            <nav class="site-nav">

                <div class="hero__actions">
                    <a href="#apps" class="btn btn--primary">アプリを見る</a>
                    <a href="https://forms.gle/6uVewEMnk95LKQ9t7" class="btn btn--ghost" target="_blank"
                        rel="noopener noreferrer">お問い合わせ</a>
                </div>
            </div>
        </section>

        <section id="apps" class="apps">
            <div class="wrap">
                <div class="section-head">
                    <h2 class="section-title">Apps</h2>
                    <p class="section-count" id="app-count" aria-live="polite"></p>
                </div>
